name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "scripts/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "scripts/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests (builds first; PGlite, no services needed)
        run: pnpm run test

      - name: E2E (Docker Postgres 17, pack-install-run consumer, live DDL)
        run: pnpm run e2e

      - name: Dash sweep
        run: bash scripts/dash-sweep.sh

      - name: Stop e2e database
        if: always()
        run: docker compose -f e2e/docker-compose.yml down
