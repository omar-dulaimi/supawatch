name: release

# Fires only when a release can actually move: a changeset lands or is
# consumed (the version PR merge deletes them), or this workflow itself
# changes. Docs, scripts, and plain code pushes stay silent; recovery
# publishes go through workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm 11.5+; Node 22 bundles npm 10.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # The gate lives INSIDE the release job on purpose: the changesets
      # "Version Packages" PR triggers no CI of its own (GITHUB_TOKEN
      # recursion guard), so nothing else stands between a bad merge and
      # a publish.
      - name: Gate (unit tests)
        run: pnpm run test

      - name: Gate (e2e)
        run: pnpm run e2e

      - name: Stop e2e database
        if: always()
        run: docker compose -f e2e/docker-compose.yml down

      - name: Version or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          commit: "release: version packages"
          title: "release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
