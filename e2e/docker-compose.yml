services:
  db:
    image: postgres:17-alpine
    container_name: supawatch-e2e-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d e2e"]
      interval: 1s
      timeout: 2s
      retries: 30
